publication_category:
  preprints:
    title: "arXiv Preprints"
  conferences:
    title: "Conference Papers"

breadcrumbs: false
future: false
read_more: "disabled"
comments:
  provider: false
analytics:
  provider:
twitter:
  username: "junteng88716710"
og_image:
og_description:
social:
  type: "Person"
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
